<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Coverflow Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe6;
    --bg-warm:#f8e6cc;
    --ink:#201e1a;
    --ink-dim:#8a8478;
    --ink-faint:#b8b2a2;
    --accent:#dd8a3e;
    --accent-2:#c46f28;
    --card-shadow: rgba(30,25,15,0.35);
    --line:#d9d1bf;
    --paper:#fffdf8;
    --display:'Playfair Display', serif;
    --ui:'Work Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--ui);}
  body{ padding:34px 16px 40px; overflow-x:hidden; }
  .wrap{ max-width:1100px; margin:0 auto; }

  /* ---------- Header ---------- */
  .kicker-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:8px; }
  .kicker-row .rule{ height:1px; width:44px; background:var(--ink-faint); }
  .kicker{
    font-family:var(--mono); font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--ink-dim); outline:none; text-align:center;
  }
  h1.title{
    font-family:var(--display); font-weight:700; font-size:clamp(34px,6.4vw,64px);
    text-align:center; margin:2px 0 30px; color:var(--ink); outline:none;
  }
  [contenteditable]:hover{ opacity:0.85; cursor:text; }

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:70px 20px; border:1.5px dashed var(--line); border-radius:8px; background:var(--paper);
  }
  .empty-state h2{ font-family:var(--display); font-weight:700; font-size:24px; margin:0 0 6px; }
  .empty-state p{ color:var(--ink-dim); font-size:13px; margin:0; }

  /* ---------- Coverflow stage ---------- */
  .stage-wrap{
    position:relative; display:none;
    background: radial-gradient(ellipse 60% 70% at 50% 62%, var(--bg-warm) 0%, transparent 68%);
    border-radius:10px; padding:10px 0 6px;
  }
  .stage-wrap.active{ display:block; }
  .stage{
    position:relative; height: min(58vw, 480px); max-height:480px; min-height:280px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    touch-action: pan-y;
  }
  .card{
    position:absolute; top:50%; left:50%;
    width: min(46vw, 300px); aspect-ratio: 3/4.5;
    border-radius:6px; overflow:hidden; cursor:pointer;
    box-shadow: 0 24px 50px var(--card-shadow);
    transition: transform .55s cubic-bezier(.22,.7,.3,1), opacity .55s ease, filter .55s ease;
    will-change: transform, opacity, filter;
  }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; filter: inherit; }
  .card .cap{
    position:absolute; left:0; right:0; bottom:0; padding:16px 16px 18px;
    background: linear-gradient(180deg, transparent, rgba(10,8,5,0.78) 75%);
    color:#f4efe4;
  }
  .card .cap .loc{
    font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:#d8cfba; margin-bottom:4px;
    outline:none;
  }
  .card .cap .name{
    font-family:var(--display); font-weight:700; font-size:clamp(19px,3vw,28px); line-height:1.05; color:#fff; outline:none;
  }
  .card .cap .rule{
    height:2px; width:34px; background:rgba(255,255,255,0.5); margin-top:9px; border-radius:2px; transition: background .4s, width .4s;
  }
  .card.is-active .cap .rule{ background:var(--accent); width:46px; }

  .nav-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:30;
    width:52px; height:52px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer; border:none;
    box-shadow: 0 8px 20px rgba(196,111,40,0.45); transition: background .2s, transform .15s;
  }
  .nav-arrow:hover{ background:var(--accent-2); transform:translateY(-50%) scale(1.06); }
  .nav-arrow.prev{ left: max(2%, 10px); }
  .nav-arrow.next{ right: max(2%, 10px); }
  .nav-arrow svg{ width:18px; height:18px; color:#fff8f0; }

  .remove-current{
    position:absolute; top:14px; right:14px; z-index:5;
    background:rgba(20,17,13,0.55); color:#f3efe4; border:none;
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    padding:6px 10px; border-radius:14px; cursor:pointer;
  }
  .remove-current:hover{ background:var(--accent-2); }

  /* ---------- Footer controls ---------- */
  .stage-footer{
    display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px;
  }
  .play-toggle{ position:relative; width:34px; height:34px; cursor:pointer; }
  .play-toggle svg.ring{ position:absolute; inset:0; transform:rotate(-90deg); }
  .play-toggle .ring-bg{ fill:none; stroke:var(--line); stroke-width:2; }
  .play-toggle .ring-fg{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; }
  .play-toggle .icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .play-toggle .icon svg{ width:11px; height:11px; }
  .idx-readout{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); }
  .idx-readout b{ color:var(--ink); }

  /* ---------- Add panel ---------- */
  .add-toggle-row{ text-align:center; margin-top:22px; }
  .toggle-add-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:1px solid var(--line); color:var(--ink); font-family:var(--ui); font-size:12.5px;
    padding:9px 16px; border-radius:18px; cursor:pointer;
  }
  .toggle-add-btn:hover{ border-color:var(--accent); color:var(--accent-2); }

  .add-panel{
    margin:16px auto 0; max-width:460px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px;
    display:none;
  }
  .add-panel.open{ display:block; }
  .tabs{ display:flex; gap:6px; margin-bottom:12px; justify-content:center; }
  .tab{
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    padding:7px 14px; border-radius:16px; background:var(--bg); color:var(--ink-dim); cursor:pointer; border:none;
  }
  .tab.active{ background:var(--accent); color:#fff8f2; }

  .drop-zone{
    border:1.5px dashed var(--line); border-radius:6px; padding:24px; text-align:center; cursor:pointer;
    transition: border-color .2s, background .2s;
  }
  .drop-zone:hover, .drop-zone.dragover{ border-color:var(--accent); background:#fbf0e2; }
  .drop-zone p{ margin:0; font-size:13px; color:var(--ink-dim); }
  .drop-zone span{ color:var(--accent-2); text-decoration:underline; }

  .url-row{ display:flex; gap:8px; }
  .url-row input{
    flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--ui); font-size:13px; outline:none; background:var(--bg);
  }
  .url-row input:focus{ border-color:var(--accent); }
  .url-row button{
    background:var(--accent); color:#fff8f2; border:none; padding:0 18px; border-radius:6px;
    font-family:var(--ui); font-weight:600; font-size:13px; cursor:pointer;
  }
  .url-row button:hover{ background:var(--accent-2); }
  .url-hint{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); margin-top:6px; text-align:center; }

  footer.etch{ text-align:center; margin-top:30px; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--ink-faint); text-transform:uppercase; }

  @media (max-width: 560px){
    .nav-arrow{ width:42px; height:42px; }
    .nav-arrow svg{ width:15px; height:15px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="kicker-row">
    <div class="rule"></div>
    <div class="kicker" contenteditable="true" id="kickerText">CURATED COLLECTION</div>
    <div class="rule"></div>
  </div>
  <h1 class="title" contenteditable="true" id="titleText">Your Gallery</h1>

  <div class="empty-state" id="emptyState">
    <h2>No images yet</h2>
    <p>Upload images or paste image URLs below to build your gallery.</p>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <!-- cards injected here -->
    </div>

    <div class="stage-footer">
      <div class="play-toggle" id="playToggle">
        <svg class="ring" viewBox="0 0 34 34">
          <circle class="ring-bg" cx="17" cy="17" r="14.5"></circle>
          <circle class="ring-fg" id="ringFg" cx="17" cy="17" r="14.5" stroke-dasharray="91.1" stroke-dashoffset="91.1"></circle>
        </svg>
        <div class="icon" id="playIcon"></div>
      </div>
      <div class="idx-readout"><b id="idxNow">1</b> / <span id="idxTotal">1</span></div>
    </div>
  </div>

  <div class="add-toggle-row">
    <button class="toggle-add-btn" id="toggleAddBtn">+ Add images</button>
  </div>

  <div class="add-panel" id="addPanel">
    <div class="tabs">
      <button class="tab active" data-tab="upload">Upload</button>
      <button class="tab" data-tab="url">Paste URL</button>
    </div>

    <div id="uploadTab">
      <div class="drop-zone" id="dropZone">
        <p>Drag & drop images here, or <span>browse files</span></p>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    </div>

    <div id="urlTab" style="display:none;">
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="https://example.com/image.jpg">
        <button id="addUrlBtn">Add</button>
      </div>
      <div class="url-hint">Paste a direct image link, then press Add or Enter.</div>
    </div>
  </div>

  <footer class="etch">Your images stay in this browser tab · nothing is uploaded anywhere</footer>
</div>

<script>
(function(){
  "use strict";

  const state = { slides: [], current: 0, playing: true, duration: 5000, timer: null, raf: null };

  const els = {
    emptyState: document.getElementById("emptyState"),
    stageWrap: document.getElementById("stageWrap"),
    stage: document.getElementById("stage"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    playToggle: document.getElementById("playToggle"),
    ringFg: document.getElementById("ringFg"),
    playIcon: document.getElementById("playIcon"),
    idxNow: document.getElementById("idxNow"),
    idxTotal: document.getElementById("idxTotal"),
    toggleAddBtn: document.getElementById("toggleAddBtn"),
    addPanel: document.getElementById("addPanel"),
    dropZone: document.getElementById("dropZone"),
    fileInput: document.getElementById("fileInput"),
    urlInput: document.getElementById("urlInput"),
    addUrlBtn: document.getElementById("addUrlBtn")
  };

  const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>`;
  const RING_CIRC = 2 * Math.PI * 14.5;

  let uid = 0;
  function nextId(){ return "s" + (uid++); }

  function addSlide(src, titleGuess){
    state.slides.push({ id: nextId(), src, loc: "Untitled place", title: titleGuess || "Untitled" });
  }

  function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
    if (files.length === 0) return;
    let loaded = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const guess = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
        addSlide(e.target.result, guess);
        loaded++;
        if (loaded === files.length) {
          state.current = state.slides.length - files.length;
          renderAll();
        }
      };
      reader.readAsDataURL(file);
    });
  }

  function handleUrl(){
    const url = els.urlInput.value.trim();
    if (!url) return;
    addSlide(url, "Untitled");
    state.current = state.slides.length - 1;
    els.urlInput.value = "";
    renderAll();
  }

  function removeSlide(idx){
    state.slides.splice(idx, 1);
    if (state.current >= state.slides.length) state.current = Math.max(0, state.slides.length - 1);
    renderAll();
  }

  /* ============ Rendering ============ */
  function renderAll(){
    const has = state.slides.length > 0;
    els.emptyState.style.display = has ? "none" : "block";
    els.stageWrap.classList.toggle("active", has);
    if (!has) { stopAutoplay(); return; }
    renderStage();
    renderIndex();
    restartAutoplay();
  }

  function shortestOffset(i, current, n){
    let diff = i - current;
    if (diff > n / 2) diff -= n;
    if (diff < -n / 2) diff += n;
    return diff;
  }

  function cardVisual(offset){
    const spacing = 160; // px between card centers, responsive-ish via clamp below through CSS width
    const tx = offset * spacing * 1.5;
    const scale = offset === 0 ? 1 : Math.abs(offset) === 1 ? 0.82 : 0.68;
    const opacity = offset === 0 ? 1 : Math.abs(offset) === 1 ? 0.85 : 0.45;
    const gray = offset === 0 ? 0 : 0.85;
    const bright = offset === 0 ? 1 : 0.72;
    const z = 10 - Math.abs(offset);

    return {
      transform: `translate(-50%,-50%) translateX(${tx}px) scale(${scale})`,
      opacity,
      zIndex: z,
      filter: `grayscale(${gray}) brightness(${bright})`
    };
  }

  function applyCardVisual(card, visual){
    card.style.transform = visual.transform;
    card.style.opacity = visual.opacity;
    card.style.zIndex = visual.zIndex;
    card.style.filter = visual.filter;
  }

  function renderStage(direction = 0){
    els.stage.querySelectorAll(".card").forEach(n => n.remove());
    const n = state.slides.length;
    const animatedCards = [];

    state.slides.forEach((s, i) => {
      const offset = shortestOffset(i, state.current, n);
      if (Math.abs(offset) > 2) return; // only render nearby cards

      const card = document.createElement("div");
      card.className = "card" + (offset === 0 ? " is-active" : "");

      const fromOffset = direction === 0 ? offset : offset + direction;
      const fromVisual = cardVisual(fromOffset);
      const toVisual = cardVisual(offset);
      applyCardVisual(card, fromVisual);

      card.innerHTML = `
        <img src="${s.src}" alt="${s.title}">
        <div class="cap">
          <div class="loc" contenteditable="true" data-field="loc">${s.loc}</div>
          <div class="name" contenteditable="true" data-field="title">${s.title}</div>
          <div class="rule"></div>
        </div>`;

      if (offset === 0) {
        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-current";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", (e) => { e.stopPropagation(); removeSlide(i); });
        card.appendChild(removeBtn);
      } else {
        card.addEventListener("click", () => goTo(i));
      }

      card.querySelectorAll("[contenteditable]").forEach(el => {
        el.addEventListener("click", (e) => { if (offset === 0) e.stopPropagation(); });
        el.addEventListener("blur", () => {
          const field = el.getAttribute("data-field");
          s[field] = el.textContent.trim() || (field === "title" ? "Untitled" : "Untitled place");
        });
      });

      els.stage.insertBefore(card, els.prevBtn);
      animatedCards.push({ card, visual: toVisual });
    });

    if (direction === 0) return;
    requestAnimationFrame(() => {
      animatedCards.forEach(({ card, visual }) => applyCardVisual(card, visual));
    });
  }

  function renderIndex(){
    els.idxNow.textContent = state.current + 1;
    els.idxTotal.textContent = state.slides.length;
  }

  /* ============ Navigation ============ */
  function goTo(i, direction = 0){
    if (state.slides.length === 0) return;
    if (direction === 0 && i !== state.current) {
      direction = shortestOffset(i, state.current, state.slides.length) > 0 ? 1 : -1;
    }
    state.current = (i + state.slides.length) % state.slides.length;
    renderStage(direction);
    renderIndex();
    restartAutoplay();
  }
  function next(){ goTo(state.current + 1, 1); }
  function prev(){ goTo(state.current - 1, -1); }

  els.prevBtn.addEventListener("click", prev);
  els.nextBtn.addEventListener("click", next);

  window.addEventListener("keydown", (e) => {
    if (state.slides.length === 0) return;
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  let touchStartX = null;
  els.stage.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  els.stage.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    touchStartX = null;
  }, { passive: true });

  let wheelDelta = 0;
  let wheelLocked = false;
  els.stage.addEventListener("wheel", (e) => {
    if (state.slides.length < 2) return;

    const unit = e.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16 : 1;
    const delta = e.deltaY * unit;
    if (Math.abs(delta) < 1) return;

    e.preventDefault();
    wheelDelta += delta;
    if (wheelLocked || Math.abs(wheelDelta) < 45) return;

    wheelDelta > 0 ? next() : prev();
    wheelDelta = 0;
    wheelLocked = true;
    window.setTimeout(() => { wheelLocked = false; }, 360);
  }, { passive: false });

  /* ============ Autoplay ============ */
  function startAutoplay(){
    if (state.slides.length < 2) { setRing(0); return; }
    state.playing = true;
    els.playIcon.innerHTML = ICON_PAUSE;
    const tickStart = performance.now();
    clearTimeout(state.timer);
    cancelAnimationFrame(state.raf);
    function tick(){
      if (!state.playing) return;
      const elapsed = performance.now() - tickStart;
      const frac = Math.min(1, elapsed / state.duration);
      setRing(frac);
      if (frac < 1) state.raf = requestAnimationFrame(tick);
    }
    tick();
    state.timer = setTimeout(() => { next(); }, state.duration);
  }
  function stopAutoplay(){
    state.playing = false;
    els.playIcon.innerHTML = ICON_PLAY;
    clearTimeout(state.timer);
    cancelAnimationFrame(state.raf);
  }
  function restartAutoplay(){ if (state.playing) startAutoplay(); }
  function setRing(frac){ els.ringFg.style.strokeDashoffset = String(RING_CIRC * (1 - frac)); }

  els.playToggle.addEventListener("click", () => {
    if (state.slides.length === 0) return;
    if (state.playing) stopAutoplay(); else startAutoplay();
  });
  els.stage.addEventListener("mouseenter", () => { if (state.playing) { clearTimeout(state.timer); cancelAnimationFrame(state.raf); } });
  els.stage.addEventListener("mouseleave", () => { if (state.playing) startAutoplay(); });

  /* ============ Add panel ============ */
  els.toggleAddBtn.addEventListener("click", () => els.addPanel.classList.toggle("open"));
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.getAttribute("data-tab");
      document.getElementById("uploadTab").style.display = which === "upload" ? "block" : "none";
      document.getElementById("urlTab").style.display = which === "url" ? "block" : "none";
    });
  });

  els.dropZone.addEventListener("click", () => els.fileInput.click());
  els.fileInput.addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(evt => els.dropZone.addEventListener(evt, (e) => { e.preventDefault(); els.dropZone.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach(evt => els.dropZone.addEventListener(evt, (e) => { e.preventDefault(); els.dropZone.classList.remove("dragover"); }));
  els.dropZone.addEventListener("drop", (e) => { if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files); });

  els.addUrlBtn.addEventListener("click", handleUrl);
  els.urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUrl(); });

  renderAll();
})();
</script>
</body>
</html>
